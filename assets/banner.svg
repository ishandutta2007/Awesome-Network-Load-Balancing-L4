<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
    .node-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
    
    /* Dynamic Animations */
    @keyframes packetFlow1 {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetFlow2 {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .flow-line-1 { stroke: #06b6d4; stroke-width: 3; stroke-dasharray: 8 12; animation: packetFlow1 3s linear infinite; }
    .flow-line-2 { stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 8 12; animation: packetFlow2 2.5s linear infinite; }
    .flow-line-3 { stroke: #ec4899; stroke-width: 3; stroke-dasharray: 8 12; animation: packetFlow1 3.5s linear infinite; }
    .pulsing-balancer { transform-origin: 1020px 200px; animation: pulseNode 3s ease-in-out infinite; }
    .floating-element { animation: floatParticle 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Tech Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Dynamic Network Load Balancing Topology (Positioned on the Right Side) -->
  <g transform="translate(50, 0)">
    <!-- Connecting Stream Paths -->
    <!-- Input Traffic -->
    <path d="M 720 200 L 850 200" class="flow-line-1" fill="none"/>
    
    <!-- Distributed Traffic Branches -->
    <path d="M 850 200 C 900 200, 920 100, 970 100" class="flow-line-1" fill="none"/>
    <path d="M 850 200 C 910 200, 920 160, 970 160" class="flow-line-2" fill="none"/>
    <path d="M 850 200 C 910 200, 920 240, 970 240" class="flow-line-2" fill="none"/>
    <path d="M 850 200 C 900 200, 920 300, 970 300" class="flow-line-3" fill="none"/>

    <!-- Ingress Node -->
    <g transform="translate(720, 200)" class="floating-element">
      <circle r="22" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#glow)"/>
      <text text-anchor="middle" dy="4" font-family="sans-serif" font-size="14" fill="#06b6d4">⚡ IN</text>
    </g>

    <!-- Central L4 Load Balancer Core -->
    <g class="pulsing-balancer">
      <rect x="815" y="165" width="70" height="70" rx="14" fill="#0f172a" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glow)"/>
      <text x="850" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">L4 CORE</text>
      <text x="850" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#38bdf8">TCP/UDP</text>
    </g>

    <!-- Backend Worker Nodes / Targets -->
    <!-- Node 1 -->
    <g transform="translate(970, 100)">
      <rect x="0" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="15" cy="0" r="4" fill="#10b981"/>
      <text x="30" y="4" class="node-label">Target-01</text>
    </g>
    <!-- Node 2 -->
    <g transform="translate(970, 160)">
      <rect x="0" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="15" cy="0" r="4" fill="#10b981"/>
      <text x="30" y="4" class="node-label">Target-02</text>
    </g>
    <!-- Node 3 -->
    <g transform="translate(970, 240)">
      <rect x="0" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="15" cy="0" r="4" fill="#10b981"/>
      <text x="30" y="4" class="node-label">Target-03</text>
    </g>
    <!-- Node 4 -->
    <g transform="translate(970, 300)">
      <rect x="0" y="-18" width="100" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="15" cy="0" r="4" fill="#10b981"/>
      <text x="30" y="4" class="node-label">Target-04</text>
    </g>
  </g>

  <!-- Foreground Text Content (Left Side - Clean & Unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Badge -->
    <g transform="translate(0, 85)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="140" y="21" text-anchor="middle" class="badge-text">⚖️ NETWORK LOAD BALANCING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">
      Awesome Layer-4
    </text>
    <text x="0" y="215" class="title" fill="url(#cyanGlow)">
      Load Balancing (L4)
    </text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">
      Curated Directory of L4 Proxies, Hyperscale Balancers &amp;
    </text>
    <text x="0" y="295" class="subtitle">
      Kernel Packet Forwarding Engines (DPDK, XDP, eBPF, IPVS)
    </text>

    <!-- Metric Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🚀 High-Throughput</text>
      <!-- Pill 2 -->
      <rect x="140" y="0" width="120" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="200" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Zero-Copy</text>
      <!-- Pill 3 -->
      <rect x="270" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="340" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🛡️ DDoS Mitigation</text>
    </g>
  </g>
</svg>
